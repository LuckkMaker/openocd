#
# Geehy APM32F4x target
#
# https://global.geehy.com/MCU
#

#
# APM32F4x devices support JTAG and SWD transport.
#
source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME algo_g32r501
}

# Work-area is a space in RAM used for flash programming, by default use 4 KiB.
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x2000
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   set _CPUTAPID 0x6AB02477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

if { [using_jtag] } {
   jtag newtap $_CHIPNAME bs -irlen 5
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20300000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _algo_flash_base 0x08000000
set _algo_otp1_base 0x0810a000
set _algo_otp2_base 0x0810b000
set _algo_base1 0x20300000
set _algo_base2 0x20301000
set _algo_data_base 0x20302000
set _algo_date_size 0x2000
set flash_init [expr {$_algo_base1 + 0x2d}]
set flash_uninit [expr {$_algo_base1 + 0x99}]
set flash_erasechip [expr {$_algo_base1 + 0x9d}]
set flash_erasesector [expr {$_algo_base1 + 0xf1}]
set flash_programpage [expr {$_algo_base1 + 0x14d}]
set otp_programpage [expr {$_algo_base2 + 0x9d}]

set _FLASHNAME $_CHIPNAME.flash
set _OTP1NAME $_CHIPNAME.otp1
set _OTP2NAME $_CHIPNAME.otp2

# banks
flash bank $_FLASHNAME algo 0x08000000 0x20000 0 0 $_TARGETNAME $_algo_data_base $_algo_date_size
flash bank $_OTP1NAME algo 0x0810a000 0x800 0 0 $_TARGETNAME $_algo_data_base $_algo_date_size
flash bank $_OTP2NAME algo 0x0810B000 0x800 0 0 $_TARGETNAME $_algo_data_base $_algo_date_size

adapter speed 2000

if {![using_hla]} {
   # if srst is not fitted use SYSRESETREQ to perform a soft reset.
   cortex_m reset_config sysresetreq
}

set output [capture "flash banks"]
set bank_count 0
foreach line [split $output "\n"] {
    if {[regexp {\d+\s+:\s+} $line]} {
        incr bank_count
    }
}

if { ![info exists OPENOCD_PATH] } {
    if { [info exists ::env(OPENOCD_PATH)] } {
        set OPENOCD_PATH $::env(OPENOCD_PATH)
    } else {
        set OPENOCD_PATH ""
    }
}

if { $OPENOCD_PATH == "" } {
    set FLM_PATH "g32r501.bin"
    set OTP_PATH "g32r501_otp.bin"
} else {
    set FLM_PATH "${OPENOCD_PATH}/g32r501.bin"
    set OTP_PATH "${OPENOCD_PATH}/g32r501_otp.bin"
}

proc algo_load {} {
    global _algo_base1 _algo_base2
    global FLM_PATH OTP_PATH

    load_image $FLM_PATH $_algo_base1 bin
    load_image $OTP_PATH $_algo_base2 bin
}

proc algo_unlock {} {
    mww 0x50024020 0xFFFFFFFF
    mww 0x50024024 0xFFFFFFDC
    mww 0x50024028 0xFFFFFFFF
    mww 0x5002402C 0xFFFFFFFF
    mww 0x500240A0 0xFFFFFFFF
    mww 0x500240A4 0xFFFEDFFF
    mww 0x500240A8 0xFFFFFFFF
    mww 0x500240AC 0xFFFFFFFF
    # mww 0x50024020 0xFFFFFFFE
    # mww 0x50024024 0xFFFDFFBF
    # mww 0x50024028 0xFFFFFFFF
    # mww 0x5002402C 0xFFFFFFFF
    # mww 0x500240A0 0xFFFFFFFE
    # mww 0x500240A4 0xFFFFFED7
    # mww 0x500240A8 0xFFFFFFFF
    # mww 0x500240AC 0xFFFFFFFF
}

proc algo_init {} {
    global flash_init
    dict set enter pc $flash_init
    algo_load
    reset halt
    wait_halt 3000
    algo_unlock
    set_reg {r0 0 r1 0 r2 0}
    set_reg $enter
    resume
}

proc algo_uninit {} {
    global flash_uninit
    dict set enter pc $flash_uninit
    set_reg {r0 0 r1 0 r2 0}
    set_reg $enter
    resume
}

proc algo_erasechip {} {
    global flash_erasechip
    dict set enter pc $flash_erasechip
    halt
    wait_halt 3000
    echo "erase: start erase chip"
    set_reg $enter
    resume
}

proc algo_erasesector {addr} {
    global flash_erasesector
    dict set arg1 r0 $addr
    dict set enter pc $flash_erasesector
    halt
    wait_halt 3000
    echo "erase sector: [format "%08x" $addr]"
    set_reg $arg1
    set_reg $enter
    resume
    sleep 200
}

proc algo_programpage {addr size buf programpage_enter} {
    dict set arg1 r0 $addr
    dict set arg2 r1 $size
    dict set arg3 r2 $buf
    dict set enter pc $programpage_enter
    halt
    wait_halt 3000
    set_reg $arg1
    set_reg $arg2
    set_reg $arg3
    set_reg $enter
    resume
    sleep 200
}

proc algo_program {fname} {
    global _algo_data_base flash_programpage otp_programpage

    flash write_image $fname
    # algo test

    set list [algo load 0 0 0]
    set addr [lindex $list 1]
    set size [lindex $list 2]
    set bankid [lindex $list 3]

    # load the hex to SRAM data region
    for {} {$size > 0} {} {
        echo "program: bank $bankid $size bytes to program at $addr"

        # start page programming
        if {$bankid == 0} {
            algo_programpage $addr $size $_algo_data_base $flash_programpage
        } else {
            algo_programpage $addr $size $_algo_data_base $otp_programpage
        }

        set list [algo load 0 0 0]
        set addr [lindex $list 1]
        set size [lindex $list 2]
        set bankid [lindex $list 3]
    }
    # free buffer
    algo done
}

proc algo_download {fname} {
    algo_init
    algo_erasechip
    algo_program $fname
}

proc algo_run {} {
    halt
    wait_halt 3000
    algo_unlock
    set pc_p [read_memory 0x08000004 32 1]
    set sp_p [read_memory 0x08000000 32 1]
    dict set pc_dict pc $pc_p
    dict set sp_dict sp $sp_p
    set_reg $pc_dict
    set_reg $sp_dict
    echo "set $pc_dict, set $sp_dict"
    # resume
}
